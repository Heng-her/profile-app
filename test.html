<!DOCTYPE html>
<html>

<head>
    <title>Post Products Test</title>
</head>

<body>
    <script>
        (async () => {
            const categoriesUrl = "https://api.escuelajs.co/api/v1/categories";
            const postUrl = "https://api.escuelajs.co/api/v1/products";
            const imageUrl = "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8cHJvZHVjdHxlbnwwfHwwfHx8MA%3D%3D";

            const categories = await fetch(categoriesUrl).then(r => r.json());
            const categoryIds = categories.map(c => c.id);

            for (let i = 1; i <= 100; i++) {
                const randomCategoryId = categoryIds[Math.floor(Math.random() * categoryIds.length)];
                const body = { title: `New Product ${i}`, price: 120, description: "Nice product", categoryId: randomCategoryId, images: [imageUrl] };
                const data = await fetch(postUrl, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(r => r.json());
                console.log(`Posted product ${i}: ID ${data.id}`);
            }
        })();
    </script>
</body>

</html>
